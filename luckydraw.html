<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lucky Draw • Coming Soon | SV Realty Solutions</title>

  <link rel="stylesheet" href="assets/styles.css">

  <style>
    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:linear-gradient(135deg,#0f172a,#1e293b);
      color:#fff;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      text-align:center;
    }

    .coming-card{
      background:#ffffff10;
      backdrop-filter:blur(12px);
      border:1px solid rgba(255,255,255,.15);
      border-radius:20px;
      padding:50px 35px;
      width:90%;
      max-width:550px;
      box-shadow:0 20px 50px rgba(0,0,0,.3);
    }

    .icon{
      font-size:70px;
      margin-bottom:20px;
    }

    h1{
      margin:10px 0;
      font-size:38px;
    }

    h3{
      color:#facc15;
      margin-bottom:15px;
      letter-spacing:2px;
      text-transform:uppercase;
    }

    p{
      color:#d1d5db;
      line-height:1.7;
      margin-bottom:30px;
    }

    .btn{
      display:inline-block;
      padding:12px 28px;
      background:#facc15;
      color:#111827;
      text-decoration:none;
      border-radius:8px;
      font-weight:bold;
      transition:.3s;
    }

    .btn:hover{
      background:#fde047;
      transform:translateY(-2px);
    }
  </style>
</head>

<body>

<div class="coming-card">

  <div class="icon">🎉</div>

  <h3>Lucky Draw</h3>

  <h1>Coming Soon!</h1>

  <p>
    We're preparing an exciting Lucky Draw experience for all
    <strong>SV Realty Solutions</strong> customers.
    Stay tuned for amazing prizes and exclusive rewards.
  </p>

  <a href="index.html" class="btn">← Back to Home</a>

</div>

</body>
</html>
